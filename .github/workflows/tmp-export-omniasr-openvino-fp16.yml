name: tmp-export-omniasr-openvino-fp16

on:
  push:
    branches:
      - tmp/omniasr-openvino-fp16-20260815
  workflow_dispatch:

jobs:
  split-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated artifact from conversion run
        uses: actions/download-artifact@v4
        with:
          name: omniASR-CTC-300M-openvino-fp16
          path: prior
          github-token: ${{ github.token }}
          run-id: 31885031250

      - name: Split archive
        run: |
          ls -lh prior/
          split -b 200M prior/omniASR-CTC-300M-openvino-fp16.zip omniASR-CTC-300M-openvino-fp16.zip.part-
          sha256sum prior/omniASR-CTC-300M-openvino-fp16.zip
          sha256sum omniASR-CTC-300M-openvino-fp16.zip.part-*
          ls -lh omniASR-CTC-300M-openvino-fp16.zip.part-*

      - uses: actions/upload-artifact@v4
        with:
          name: omniASR-fp16-part-aa
          path: omniASR-CTC-300M-openvino-fp16.zip.part-aa
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: omniASR-fp16-part-ab
          path: omniASR-CTC-300M-openvino-fp16.zip.part-ab
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: omniASR-fp16-part-ac
          path: omniASR-CTC-300M-openvino-fp16.zip.part-ac
          compression-level: 0
          retention-days: 1
