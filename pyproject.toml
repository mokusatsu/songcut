[project]
name = "songcut"
version = "0.1.0"
description = "Local VSinger singing-stream segment extractor for Intel CPU/NPU-class machines."
requires-python = ">=3.11"
dependencies = [
  "ass-lyric-effects @ file:./third_party/ass_lyric_effects/ass_lyric_effects-3.0.0-py3-none-any.whl#sha256=c9ec21d353543215aaaed7424b775732714c344d05356b5ec9eeef20fc212fed",
  "lossless-audio-gain @ file:./third_party/lossless_audio_gain/lossless_audio_gain-0.1.0",
  "numpy>=2.0",
  "win-safesubprocess>=0.1,<0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "librosa>=0.11,<0.12",
]
openvino = [
  "openvino>=2026.0",
]
gui = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "librosa>=0.11,<0.12",
  "openvino>=2026.0",
  "openvino-genai>=2026.0",
  "openvino-tokenizers>=2026.0",
  "huggingface-hub>=0.30",
  "pyinstaller>=6.0",
  "soundfile>=0.14",
  "uroman>=1.3",
  "pykakasi>=2.3",
]
mms = [
  "openvino>=2026.0",
  "uroman>=1.3",
  "pykakasi>=2.3",
]

[project.scripts]
songcut = "songcut.cli:main"
songcut-api = "songcut.api:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["songcut", "uta_align"]
py-modules = ["songcut_cli"]
package-dir = { uta_align = "third_party/uta_align/src/uta_align" }

[tool.pytest.ini_options]
pythonpath = [".", "third_party/uta_align/src", "third_party/lossless_audio_gain/lossless_audio_gain-0.1.0/src"]
testpaths = ["tests"]
addopts = ["-ra", "--durations=25"]
